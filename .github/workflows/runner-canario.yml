# Canário do runner próprio (docs/operacao/runner-proprio.md, passo 11). Só existe no branch canario-runner:
# push neste branch não dispara o ci.yml (só pull_request) nem o deploy.yml (só main). Custo hospedado: zero.
name: runner-canario
on:
  push:
    branches: [canario-runner]

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    steps:
      - name: Barreiras vistas de dentro de um job (o hook inicio.sh já rodou antes)
        run: |
          nega() { if "$@" >/dev/null 2>&1; then echo "::error::FURO: $*"; exit 1; fi; echo "barrado: $*"; }
          docker info -f '{{.SecurityOptions}} {{.Swarm.LocalNodeState}}'
          nega docker -H unix:///run/docker.sock version
          nega ls /etc/easypanel
          nega curl -sS -m5 http://127.0.0.1:3000
          nega curl -sS -m5 https://nutri.wsscloud.tech
          nega docker run --rm --user 1000 -v /:/h alpine:3.20 ls /h/etc/easypanel
          curl -sS -m10 https://api.github.com/zen; echo

  servicos:
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    container: { image: postgres:16-alpine }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: canario }
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Serviço alcançável pelo nome (padrão do E2E)
        run: pg_isready -h postgres -U postgres
      - name: Contêiner do job não alcança o host
        run: |
          if wget -T5 -qO- http://10.0.2.2:3000 >/dev/null 2>&1; then echo "::error::FURO: 10.0.2.2:3000"; exit 1; fi
          echo "barrado: 10.0.2.2:3000"

  rede-conteiner:
    # Diagnóstico: de dentro do contêiner do job, por qual caminho se alcança uma porta publicada por um contêiner irmão
    # (é o que o Testcontainers faz com o Ryuk e o Postgres). O job só relata; nenhuma rota precisa dar certo.
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: >-
        -v /run/user/1500/docker.sock:/run/user/1500/docker.sock
        -v /usr/bin/docker:/usr/local/bin/docker:ro
    env:
      DOCKER_HOST: unix:///run/user/1500/docker.sock
    steps:
      - name: Rotas até uma porta publicada
        shell: bash
        run: |
          tenta() { if timeout 4 bash -c "</dev/tcp/${2%:*}/${2#*:}" 2>/dev/null; then echo "OK    $1 ($2)"; else echo "falha $1 ($2)"; fi; }
          ip_em() { docker inspect "$1" -f "{{with index .NetworkSettings.Networks \"$2\"}}{{.IPAddress}}{{end}}"; }
          docker version -f 'docker {{.Server.Version}}'
          docker info -f '{{.SecurityOptions}}'
          docker rm -f eco >/dev/null 2>&1 || true
          docker run -d --name eco -p 0:80 nginx:alpine >/dev/null
          sleep 3
          P=$(docker port eco 80/tcp | head -1 | sed 's/.*://')
          ECO=$(ip_em eco bridge)
          EU=$(hostname)
          REDE=$(docker inspect "$EU" -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          GWJOB=$(docker network inspect "$REDE" -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}')
          GWBR=$(docker network inspect bridge -f '{{range .IPAM.Config}}{{.Gateway}}{{end}}')
          echo "porta=$P eco=$ECO rede do job=$REDE gw job=$GWJOB gw bridge=$GWBR"
          tenta "A gateway do job + porta publicada" "$GWJOB:$P"
          tenta "B IP do irmão na bridge, porta interna" "$ECO:80"
          tenta "C gateway da bridge + porta publicada" "$GWBR:$P"
          docker network connect bridge "$EU" && echo "-- job ligado também à rede bridge"
          tenta "D (ligado) gateway da bridge + porta publicada" "$GWBR:$P"
          tenta "E (ligado) IP do irmão na bridge" "$ECO:80"
          tenta "F (ligado) gateway do job + porta publicada" "$GWJOB:$P"
          docker network connect "$REDE" eco && echo "-- irmão ligado à rede do job"
          ECO2=$(ip_em eco "$REDE")
          tenta "G irmão na rede do job, porta interna" "$ECO2:80"
          tenta "H irmão pelo nome na rede do job" "eco:80"
          docker rm -f eco >/dev/null

  rede-host:
    # O mesmo, com o job direto no runner (sem contêiner): o Testcontainers usaria localhost.
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    steps:
      - name: Porta publicada vista do runner
        run: |
          tenta() { if curl -s -m4 -o /dev/null "http://$2"; then echo "OK    $1 ($2)"; else echo "falha $1 ($2)"; fi; }
          docker rm -f eco2 >/dev/null 2>&1 || true
          docker run -d --name eco2 -p 0:80 nginx:alpine >/dev/null
          sleep 3
          P=$(docker port eco2 80/tcp | head -1 | sed 's/.*://')
          echo "porta publicada=$P"
          tenta "localhost + porta publicada" "127.0.0.1:$P"
          docker rm -f eco2 >/dev/null

  testcontainers:
    # Amostra do `pnpm test` no Docker rootless. O contêiner do job fica numa rede própria do runner, e o isolamento entre
    # redes do Docker barra o caminho até a porta publicada do Ryuk/Postgres (que nascem na rede bridge). Hipótese do
    # canário: ligar o job também à bridge e apontar o Testcontainers para o gateway dela.
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: >-
        --cpus 4 --memory 8g
        -v nutri-ci-pnpm:/pnpm-store
        -v /run/user/1500/docker.sock:/run/user/1500/docker.sock
        -v /usr/bin/docker:/usr/local/bin/docker:ro
    env:
      DOCKER_HOST: unix:///run/user/1500/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/user/1500/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: 172.17.0.1
      DEBUG: testcontainers*
    steps:
      - name: Liga o contêiner do job à rede bridge (onde o Testcontainers cria os contêineres)
        run: docker network connect bridge "$(hostname)"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - name: Testcontainers no Docker rootless (amostra do pnpm test)
        run: pnpm exec vitest run src/db/rls-guard.test.ts src/db/db-error.test.ts
