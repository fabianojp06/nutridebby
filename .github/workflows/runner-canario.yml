# Canário do runner próprio (docs/operacao/runner-proprio.md, passo 11). Só existe no branch canario-runner:
# push neste branch não dispara o ci.yml (só pull_request) nem o deploy.yml (só main). Custo hospedado: zero.
name: runner-canario
on:
  push:
    branches: [canario-runner]

permissions:
  contents: read

jobs:
  host:
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    steps:
      - name: Barreiras vistas de dentro de um job (o hook inicio.sh já rodou antes)
        run: |
          nega() { if "$@" >/dev/null 2>&1; then echo "::error::FURO: $*"; exit 1; fi; echo "barrado: $*"; }
          docker info -f '{{.SecurityOptions}} {{.Swarm.LocalNodeState}}'
          nega docker -H unix:///run/docker.sock version
          nega ls /etc/easypanel
          nega curl -sS -m5 http://127.0.0.1:3000
          nega curl -sS -m5 https://nutri.wsscloud.tech
          nega docker run --rm --user 1000 -v /:/h alpine:3.20 ls /h/etc/easypanel
          curl -sS -m10 https://api.github.com/zen; echo

  servicos:
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    container: { image: postgres:16-alpine }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: canario }
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Serviço alcançável pelo nome (padrão do E2E)
        run: pg_isready -h postgres -U postgres
      - name: Contêiner do job não alcança o host
        run: |
          if wget -T5 -qO- http://10.0.2.2:3000 >/dev/null 2>&1; then echo "::error::FURO: 10.0.2.2:3000"; exit 1; fi
          echo "barrado: 10.0.2.2:3000"

  rede-conteiner:
    # Diagnóstico: de dentro do contêiner do job, por qual caminho se alcança uma porta publicada por um contêiner irmão
    # (é o que o Testcontainers faz com o Ryuk e o Postgres). O job só relata; nenhuma rota precisa dar certo.
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: >-
        -v /run/user/1500/docker.sock:/run/user/1500/docker.sock
        -v /usr/bin/docker:/usr/local/bin/docker:ro
    env:
      DOCKER_HOST: unix:///run/user/1500/docker.sock
    steps:
      - name: Rotas até uma porta publicada
        shell: bash
        run: |
          tenta() { if timeout 4 bash -c "</dev/tcp/${2%:*}/${2#*:}" 2>/dev/null; then echo "OK    $1 ($2)"; else echo "falha $1 ($2)"; fi; }
          docker rm -f eco >/dev/null 2>&1 || true
          docker run -d --name eco -p 0:80 nginx:alpine >/dev/null
          sleep 3
          P=$(docker port eco 80/tcp | head -1 | sed 's/.*://')
          ECO=$(docker inspect eco -f '{{.NetworkSettings.IPAddress}}')
          GW=$(awk '$2=="00000000"{h=$3; printf "%d.%d.%d.%d\n", strtonum("0x" substr(h,7,2)), strtonum("0x" substr(h,5,2)), strtonum("0x" substr(h,3,2)), strtonum("0x" substr(h,1,2)); exit}' /proc/net/route 2>/dev/null)
          echo "porta publicada=$P  eco=$ECO  gateway do job=$GW  hostname=$(hostname)"
          tenta "gateway do job + porta publicada (padrão do Testcontainers)" "$GW:$P"
          tenta "IP do contêiner irmão, porta interna" "$ECO:80"
          tenta "docker0 + porta publicada" "172.17.0.1:$P"
          docker network connect bridge "$(hostname)" && echo "job ligado também à rede bridge"
          tenta "depois de ligar à bridge: docker0 + porta publicada" "172.17.0.1:$P"
          tenta "depois de ligar à bridge: IP do irmão" "$ECO:80"
          docker rm -f eco >/dev/null

  rede-host:
    # O mesmo, com o job direto no runner (sem contêiner): o Testcontainers usaria localhost.
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 10
    steps:
      - name: Porta publicada vista do runner
        run: |
          tenta() { if curl -s -m4 -o /dev/null "http://$2"; then echo "OK    $1 ($2)"; else echo "falha $1 ($2)"; fi; }
          docker rm -f eco2 >/dev/null 2>&1 || true
          docker run -d --name eco2 -p 0:80 nginx:alpine >/dev/null
          sleep 3
          P=$(docker port eco2 80/tcp | head -1 | sed 's/.*://')
          echo "porta publicada=$P"
          tenta "localhost + porta publicada" "127.0.0.1:$P"
          docker rm -f eco2 >/dev/null
