name: ci
# Deploy sem repetir o CI do PR (revisão do branch, 09/10/2026): o nome da execução grava o número do PR e o base.sha no
# momento em que ela é criada (`ci-pr-<n>-<sha>`). A API só preenche workflow_runs[].pull_requests enquanto o PR está
# aberto; depois do merge, é por este nome que .github/scripts/ci-ja-passou.sh confere que a execução é do PR certo e de
# que base. Quando o deploy chama este workflow (workflow_call), o run-name daqui é ignorado: vale o nome do deploy.
run-name: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.base.sha) || 'ci' }}

on:
  pull_request:
  workflow_call:
    outputs:
      codigo:
        description: "'true' quando a mudança não é só de documentação (o deploy só publica nesse caso)"
        value: ${{ jobs.mudancas.outputs.codigo }}

# Cancela execuções anteriores da mesma PR quando um novo commit chega, para
# economizar minutos do Actions. Quando este workflow é chamado a partir do
# deploy (push em main), o evento não é "pull_request" e o cancelamento fica
# desativado, então o deploy nunca é interrompido no meio.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Runner próprio (docs/operacao/runner-proprio.md, 12/10/2026): os jobs rodam na VPS, no usuário gh-runner com Docker
# rootless, filtro de rede e vigias de início e fim de job (infra/runner/). Custo de minutos do Actions: zero. Os
# `container:` com --cpus/--memory são conveniência, não barreira: o limite real é a user-1500.slice (o YAML de um PR pode
# tirar isto). Nunca usar este runner em pull_request_target, workflow_run ou issue_comment (guarda em
# test/runner-proprio.test.ts).
jobs:
  # Plano 12 (R-D1, dono, 07/10/2026): PR ou push na main só de documentação (docs/**, *.md, .claude/agents/**) não roda
  # test, e2e nem image (economia de minutos do Actions), e o deploy não reconstrói a imagem. Sem ação de terceiros: git diff
  # contra a base (PR: o ponto em que o branch saiu da main; push: o commit anterior). Na dúvida — base ausente ou fora do
  # histórico (primeiro push, push forçado), diff vazio —, roda tudo. O quality roda sempre.
  mudancas:
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filtro
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          codigo=true
          if [[ -n "${BASE:-}" && ! "$BASE" =~ ^0+$ ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            arquivos="$(git diff --name-only "${BASE}...${HEAD}")"
            if [[ -n "$arquivos" ]] && ! grep -qEv '^(docs/|\.claude/agents/)|\.md$' <<<"$arquivos"; then
              codigo=false
            fi
          fi
          echo "Mudança com código: ${codigo}"
          echo "codigo=${codigo}" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --cpus 4 --memory 6g -v nutri-ci-pnpm:/pnpm-store
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Sem DAC_OVERRIDE/DAC_READ_SEARCH: o job roda como root no contêiner, e os testes de pasta ilegível (chmod 000)
      # precisam que as permissões valham, como no usuário comum do runner hospedado
      options: >-
        --cpus 4 --memory 8g
        --cap-drop DAC_OVERRIDE --cap-drop DAC_READ_SEARCH
        -v nutri-ci-pnpm:/pnpm-store
        -v /run/user/1500/docker.sock:/run/user/1500/docker.sock
        -v /usr/bin/docker:/usr/local/bin/docker:ro
        -v /usr/bin/rclone:/usr/local/bin/rclone:ro
    env:
      DOCKER_HOST: unix:///run/user/1500/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/user/1500/docker.sock
      # A porta publicada do Docker rootless só existe do lado do host: o job fala com o Postgres pelo IP na rede bridge
      # (test/postgres-teste.ts). Sem Ryuk: o vigia fim.sh apaga todos os contêineres no fim de cada job.
      NUTRI_CI_REDE_DIRETA: '1'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: docker e rclone do host (montados só leitura), daemon rootless e job ligado à rede bridge
        run: |
          command -v rclone && command -v docker
          docker info -f '{{.SecurityOptions}}' | grep -q rootless
          test "$(docker info -f '{{.Swarm.LocalNodeState}}')" = inactive
          docker network connect bridge "$(hostname)"
      - name: jq (o ci-ja-passou.sh usa; a imagem do Playwright não traz)
        # Binário estático oficial, conferido pelo sha256 publicado na release (o apt não roda sem DAC_OVERRIDE)
        run: |
          curl -fsSL -o /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  /usr/local/bin/jq" | sha256sum -c -
          chmod 755 /usr/local/bin/jq && jq --version
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - run: pnpm test   # inclui a guarda de RLS (Testcontainers usa o Docker do runner)
      # Testes que medem tempo (*.tempo.test.ts), depois da suíte e um por vez: ao lado dos outros workers, a cota de CPU
      # do runner pausa o grupo e o teste mede a pausa (test/arquivos-de-tempo.ts)
      - run: pnpm test:tempo

  e2e:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --cpus 4 --memory 8g --shm-size 1g -v nutri-ci-pnpm:/pnpm-store
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: nutri }
        options: >-
          --health-cmd "pg_isready -U owner -d nutri" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000   # localhost do contêiner do job (não o painel do Easypanel)
      # Serviços pelo nome, na rede do job (o runner próprio não publica portas)
      DATABASE_URL: postgres://nutri_app:ci-app@postgres:5432/nutri
      DATABASE_URL_MIGRATOR: postgres://owner:owner@postgres:5432/nutri
      AUTH_SECRET: ci-secret-with-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # TEST-NET-1: validação de produção satisfeita sem confiar em nenhum IP; o E2E manda um único X-Forwarded-For
      TRUSTED_PROXIES: 192.0.2.0/24
      EMAIL_FROM: 'NutriDebby <nao-responda@nutridebby.test>'
      EMAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
      FILE_URL_SECRET: ci-file-url-secret-with-at-least-32-chars
      DATA_DIR: /tmp/nd-data   # /tmp do contêiner do job, descartado no fim
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # Plano 05 (D1): WhatsApp pelo sandbox (Mailpit); o E2E assina os webhooks com o segredo
      WHATSAPP_SANDBOX: '1'
      EVOLUTION_WEBHOOK_SECRET: ci-webhook-secret-with-at-least-32-characters
      # Plano 11 (RNF-107): IA de laudos pelo sandbox — respostas fixas, nenhuma chamada à API real
      IA_PROVEDOR: sandbox
      # Plano 14A (A-D4): retenção zero só no E2E/dev, com o sandbox
      IA_RETENCAO_ZERO: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - run: pnpm exec playwright install chromium   # a imagem já traz as dependências do sistema
      - run: pnpm db:migrate
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm test:e2e --project=chromium --project=celular --project=painel   # o webkit roda no e2e-webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }

  # SUS-117: o portal do paciente no WebKit (Safari do iPhone; projeto `webkit` do playwright.config.ts). Job próprio, e não
  # mais um projeto no `e2e`: a estimativa (55 testes do portal, os mais pesados da suíte, com o WebKit mais lento que o
  # Chromium) passa dos 5 min, e um banco só dele evita que os mesmos specs rodem duas vezes contra as mesmas contas fixas
  # (MULTI, tema e cor do consultório da nutricionista) e os mesmos IPs do limite de login. Mesmo contêiner, serviços e
  # ambiente do `e2e`; a imagem do Playwright já traz o WebKit e as dependências dele.
  e2e-webkit:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: [self-hosted, nutri-ci]
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --cpus 4 --memory 8g --shm-size 1g -v nutri-ci-pnpm:/pnpm-store
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: nutri }
        options: >-
          --health-cmd "pg_isready -U owner -d nutri" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000   # localhost do contêiner do job (não o painel do Easypanel)
      # Serviços pelo nome, na rede do job (o runner próprio não publica portas)
      DATABASE_URL: postgres://nutri_app:ci-app@postgres:5432/nutri
      DATABASE_URL_MIGRATOR: postgres://owner:owner@postgres:5432/nutri
      AUTH_SECRET: ci-secret-with-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # TEST-NET-1: validação de produção satisfeita sem confiar em nenhum IP; o E2E manda um único X-Forwarded-For
      TRUSTED_PROXIES: 192.0.2.0/24
      EMAIL_FROM: 'NutriDebby <nao-responda@nutridebby.test>'
      EMAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
      FILE_URL_SECRET: ci-file-url-secret-with-at-least-32-chars
      DATA_DIR: /tmp/nd-data   # /tmp do contêiner do job, descartado no fim
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # Plano 05 (D1): WhatsApp pelo sandbox (Mailpit); o E2E assina os webhooks com o segredo
      WHATSAPP_SANDBOX: '1'
      EVOLUTION_WEBHOOK_SECRET: ci-webhook-secret-with-at-least-32-characters
      # Plano 11 (RNF-107): IA de laudos pelo sandbox — respostas fixas, nenhuma chamada à API real
      IA_PROVEDOR: sandbox
      # Plano 14A (A-D4): retenção zero só no E2E/dev, com o sandbox
      IA_RETENCAO_ZERO: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - run: pnpm exec playwright install webkit   # a imagem já traz as dependências do sistema
      - run: pnpm db:migrate
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm test:e2e --project=webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report-webkit, path: playwright-report }

  image:
    needs: mudancas
    if: needs.mudancas.outputs.codigo == 'true'
    runs-on: [self-hosted, nutri-ci]   # no host do runner; DOCKER_HOST vem do .env do runner (daemon rootless)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with: { driver: docker }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nutridebby:ci
      - name: Orçamento da imagem (GitHub Pro = 2 GB de pacotes para as 2 versões mantidas)
        # M1: pipefail — falha do `docker save` não pode virar 0 MB aprovado; MB arredondado para cima
        # Plano 12 (D-R2, aprovada pelo dono em 07/10/2026): o limite sobe de 260 para 265 MB (o PDFium em WASM da rasterização)
        # Plano 15 (15/10/2026): o dono assinou o GitHub Pro (2 GB de pacotes); a imagem chegou a 266 MB e o limite sobe para
        # 300 MB — duas versões mantidas (600 MB) seguem bem abaixo dos 2 GB, sem custo
        shell: bash
        run: |
          set -euo pipefail
          # Mesma conta em qualquer Docker: o pacote do `docker save` com as camadas SEM compressão, comprimido de uma vez
          # (gzip -6). O Docker 28 hospedado já salva as camadas assim; o 29 do runner próprio (armazenamento do containerd)
          # salva em gzip, então elas são descomprimidas antes (medir sem isso dava 266-267 MB contra 263, em 12/10/2026).
          d="$RUNNER_TEMP/orcamento-imagem"; rm -rf "$d"; mkdir -p "$d"
          docker save nutridebby:ci | tar -x -C "$d"
          find "$d" -type f -size +0 | while read -r f; do
            if gzip -t "$f" 2>/dev/null; then gzip -dc "$f" > "$f.u" && mv "$f.u" "$f"; fi
          done
          bytes=$(tar -C "$d" -cf - . | gzip -6 | wc -c)
          rm -rf "$d"
          mb=$(( (bytes + 1024 * 1024 - 1) / 1024 / 1024 ))
          echo "Imagem comprimida: ${mb} MB (limite 300 MB)"
          test "$mb" -le 300 || { echo "::error::Imagem com ${mb} MB passa do orçamento de 300 MB"; exit 1; }
      - name: O worker carrega o pdf-lib e o SDK da IA na imagem podada (Plano 11)
        # O Dockerfile apaga partes do pdf-lib e do @anthropic-ai/sdk que não rodam; aqui, o preparo do PDF (thread com o
        # DecodeStream do pdf-lib) e o cliente do SDK sobem como no worker. Nenhuma chamada sai (sem rede para o provedor).
        # Plano 14A: também o SDK do Bedrock e a assinatura SigV4 das dependências da AWS podadas (fetch falso).
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node -e NODE_ENV=production nutridebby:ci --import tsx --input-type=module -e "
            const { PDFDocument } = await import('pdf-lib');
            const d = await PDFDocument.create(); d.addPage();
            const { prepararLaudo } = await import('./src/modules/ia/preparar-arquivo.ts');
            const r = await prepararLaudo(Buffer.from(await d.save()));
            if (r.tipo !== 'pdf' || r.paginas !== 1) throw new Error('preparo do PDF falhou na imagem');
            const { default: Anthropic } = await import('@anthropic-ai/sdk');
            if (typeof new Anthropic({ apiKey: 'ci' }).messages.create !== 'function') throw new Error('SDK da IA não carregou');
            const { provedorBedrock } = await import('./src/modules/ia/provedor-bedrock.ts');
            const b = provedorBedrock({ regiao: 'eu-central-1', accessKeyId: 'AKIA' + 'C'.repeat(16), secretAccessKey: 'c'.repeat(40) });
            if (b.nome !== 'bedrock-eu' || typeof b.lerDocumento !== 'function') throw new Error('SDK do Bedrock não carregou');
            // Plano 14A: a assinatura SigV4 (@smithy/*) roda na imagem podada — contra um fetch falso, sem rede
            const msg = { id: 'm', type: 'message', role: 'assistant', model: 'x', content: [{ type: 'text', text: '{}' }], stop_reason: 'end_turn', stop_sequence: null, usage: { input_tokens: 1, output_tokens: 1 } };
            const falso = async (u, init) => { if (!String(new Headers(init?.headers).get('authorization')).startsWith('AWS4-HMAC-SHA256 ')) throw new Error('sem SigV4'); return new Response(JSON.stringify(msg), { status: 200, headers: { 'content-type': 'application/json' } }); };
            const lido = await provedorBedrock({ regiao: 'eu-central-1', accessKeyId: 'AKIA' + 'C'.repeat(16), secretAccessKey: 'c'.repeat(40), fetch: falso })
              .lerDocumento({ modelo: 'claude-sonnet-5-5', geo: 'eu', sistema: 's', instrucao: 'i', arquivo: { tipo: 'imagem', base64: 'AA==' }, schema: { type: 'object' }, maxTokens: 10, esforco: 'low' });
            if (lido.tipo !== 'ok') throw new Error('provedor do Bedrock falhou na imagem');
            console.log('IA ok na imagem');"
      - name: O worker rasteriza PDF na imagem podada (Plano 12)
        # O Dockerfile poda o @hyzyla/pdfium; aqui o processo filho sobe como no worker (node puro, .ts com tipos apagados).
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node -e NODE_ENV=production nutridebby:ci --import tsx --input-type=module -e "
            const { PDFDocument } = await import('pdf-lib');
            const d = await PDFDocument.create(); d.addPage([595, 842]);
            const { rasterizarPdf } = await import('./src/modules/pacientes/rasterizar-pdf.ts');
            let n = 0;
            const r = await rasterizarPdf(Buffer.from(await d.save()), { limitePaginas: 10, ladoMax: 2000, maxPixelsImagem: 20000000 }, async () => { n++; });
            if (r.paginas !== 1 || n !== 1) throw new Error('rasterização falhou na imagem');
            console.log('rasterização ok na imagem');"
      - name: Limpar a imagem do CI
        if: always()
        run: docker image rm -f nutridebby:ci
