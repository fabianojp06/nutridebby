name: ci

on:
  pull_request:
  workflow_call:

# Cancela execuções anteriores da mesma PR quando um novo commit chega, para
# economizar minutos do Actions. Quando este workflow é chamado a partir do
# deploy (push em main), o evento não é "pull_request" e o cancelamento fica
# desativado, então o deploy nunca é interrompido no meio.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: rclone (teste do script de backup, P02-10)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rclone
      - run: pnpm test   # inclui a guarda de RLS (Testcontainers usa o Docker do runner)

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: nutri }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d nutri" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['8025:8025', '1025:1025']
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://nutri_app:ci-app@localhost:5432/nutri
      DATABASE_URL_MIGRATOR: postgres://owner:owner@localhost:5432/nutri
      AUTH_SECRET: ci-secret-with-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # TEST-NET-1: validação de produção satisfeita sem confiar em nenhum IP; o E2E manda um único X-Forwarded-For
      TRUSTED_PROXIES: 192.0.2.0/24
      EMAIL_FROM: 'NutriDebby <nao-responda@nutridebby.test>'
      EMAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://localhost:8025
      FILE_URL_SECRET: ci-file-url-secret-with-at-least-32-chars
      DATA_DIR: /tmp/nd-data
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # Plano 05 (D1): WhatsApp pelo sandbox (Mailpit); o E2E assina os webhooks com o segredo
      WHATSAPP_SANDBOX: '1'
      EVOLUTION_WEBHOOK_SECRET: ci-webhook-secret-with-at-least-32-characters
      # Plano 11 (RNF-107): IA de laudos pelo sandbox — respostas fixas, nenhuma chamada à API real
      IA_PROVEDOR: sandbox
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nutridebby:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Orçamento da imagem (GHCR grátis = 500 MB para as 2 versões mantidas)
        # M1: pipefail — falha do `docker save` não pode virar 0 MB aprovado; MB arredondado para cima
        # Plano 12 (D-R2, aprovada pelo dono em 07/10/2026): o limite sobe de 260 para 265 MB (o PDFium em WASM da rasterização)
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(docker save nutridebby:ci | gzip -6 | wc -c)
          mb=$(( (bytes + 1024 * 1024 - 1) / 1024 / 1024 ))
          echo "Imagem comprimida: ${mb} MB (limite 265 MB)"
          test "$mb" -le 265 || { echo "::error::Imagem com ${mb} MB passa do orçamento de 265 MB"; exit 1; }
      - name: O worker carrega o pdf-lib e o SDK da IA na imagem podada (Plano 11)
        # O Dockerfile apaga partes do pdf-lib e do @anthropic-ai/sdk que não rodam; aqui, o preparo do PDF (thread com o
        # DecodeStream do pdf-lib) e o cliente do SDK sobem como no worker. Nenhuma chamada sai (sem rede para o provedor).
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node -e NODE_ENV=production nutridebby:ci --import tsx --input-type=module -e "
            const { PDFDocument } = await import('pdf-lib');
            const d = await PDFDocument.create(); d.addPage();
            const { prepararLaudo } = await import('./src/modules/ia/preparar-arquivo.ts');
            const r = await prepararLaudo(Buffer.from(await d.save()));
            if (r.tipo !== 'pdf' || r.paginas !== 1) throw new Error('preparo do PDF falhou na imagem');
            const { default: Anthropic } = await import('@anthropic-ai/sdk');
            if (typeof new Anthropic({ apiKey: 'ci' }).messages.create !== 'function') throw new Error('SDK da IA não carregou');
            console.log('IA ok na imagem');"
      - name: O worker rasteriza PDF na imagem podada (Plano 12)
        # O Dockerfile poda o @hyzyla/pdfium; aqui o processo filho sobe como no worker (node puro, .ts com tipos apagados).
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node -e NODE_ENV=production nutridebby:ci --import tsx --input-type=module -e "
            const { PDFDocument } = await import('pdf-lib');
            const d = await PDFDocument.create(); d.addPage([595, 842]);
            const { rasterizarPdf } = await import('./src/modules/pacientes/rasterizar-pdf.ts');
            let n = 0;
            const r = await rasterizarPdf(Buffer.from(await d.save()), { limitePaginas: 10, ladoMax: 2000, maxPixelsImagem: 20000000 }, async () => { n++; });
            if (r.paginas !== 1 || n !== 1) throw new Error('rasterização falhou na imagem');
            console.log('rasterização ok na imagem');"
