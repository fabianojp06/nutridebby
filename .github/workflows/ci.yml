name: ci

on:
  pull_request:
  workflow_call:

# Cancela execuções anteriores da mesma PR quando um novo commit chega, para
# economizar minutos do Actions. Quando este workflow é chamado a partir do
# deploy (push em main), o evento não é "pull_request" e o cancelamento fica
# desativado, então o deploy nunca é interrompido no meio.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: rclone (teste do script de backup, P02-10)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rclone
      - run: pnpm test   # inclui a guarda de RLS (Testcontainers usa o Docker do runner)

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: owner, POSTGRES_PASSWORD: owner, POSTGRES_DB: nutri }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d nutri" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['8025:8025', '1025:1025']
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://nutri_app:ci-app@localhost:5432/nutri
      DATABASE_URL_MIGRATOR: postgres://owner:owner@localhost:5432/nutri
      AUTH_SECRET: ci-secret-with-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # TEST-NET-1: validação de produção satisfeita sem confiar em nenhum IP; o E2E manda um único X-Forwarded-For
      TRUSTED_PROXIES: 192.0.2.0/24
      EMAIL_FROM: 'NutriDebby <nao-responda@nutridebby.test>'
      EMAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://localhost:8025
      FILE_URL_SECRET: ci-file-url-secret-with-at-least-32-chars
      DATA_DIR: /tmp/nd-data
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report }

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nutridebby:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Orçamento da imagem (GHCR grátis = 500 MB para as 2 versões mantidas)
        run: |
          bytes=$(docker save nutridebby:ci | gzip -6 | wc -c)
          mb=$((bytes / 1024 / 1024))
          echo "Imagem comprimida: ${mb} MB (limite 260 MB)"
          test "$mb" -le 260 || { echo "::error::Imagem com ${mb} MB passa do orçamento de 260 MB"; exit 1; }
