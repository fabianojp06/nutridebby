name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    # Plano 12 (R-D1): commit só de documentação não reconstrói a imagem nem refaz o deploy (ci.yml, job mudancas)
    if: needs.ci.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Sem atestados: cada push vira um único manifesto (não um índice
          # com filhos "untagged" de proveniência/SBOM), então a poda abaixo
          # com min-versions-to-keep conta versões reais de imagem.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Poda logo após o push e antes dos webhooks: se o deploy falhar (ex.: segredos
      # ainda não cadastrados), a poda já rodou. Mantém a imagem recém-publicada e a
      # anterior (a que está rodando), então nunca remove a imagem em uso.
      - name: Manter só as 2 versões mais recentes da imagem no GHCR (custo zero — 500 MB grátis)
        uses: actions/delete-package-versions@v5
        with:
          package-name: nutridebby
          package-type: container
          min-versions-to-keep: 2
      - name: Disparar deploy no Easypanel
        env:
          HOOK_APP: ${{ secrets.EASYPANEL_DEPLOY_HOOK_APP }}
          HOOK_WORKER: ${{ secrets.EASYPANEL_DEPLOY_HOOK_WORKER }}
        run: |
          test -n "$HOOK_APP" && test -n "$HOOK_WORKER" || { echo "Webhooks do Easypanel não configurados"; exit 1; }
          curl -fsS -X POST "$HOOK_APP" > /dev/null
          curl -fsS -X POST "$HOOK_WORKER" > /dev/null
